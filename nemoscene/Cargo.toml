[package]
name = "nemoscene"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.79"
env_logger = "0.11.2"
html-to-string-macro = "0.2.5"
log = "0.4.20"
once_cell = "1.19.0"
http_req = "0.13.1"
openssl-sys = {  version = "0.9.102", features = ["vendored"] }
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.114"
toml = "0.8.9"
url-escape = "0.1.1"
walkdir = "2.5.0"
rppal = {  version = "0.22.1", features = ["hal"] }
embedded-hal = "1.0.0"
lazy_static = "1.5.0"
reqwest = { version = "0.12.9", features = ["multipart", "blocking"] }
wav_io = "0.1.15"
whisper-rs = "0.13.2"
faster-whisper-rs = "0.2.0"
pocketsphinx = "0.6.0"
